name: Check

# На main эти проверки вызывает workflow релиза перед публикацией и деплоем, а ветки
# проверяются через PR. Отдельный прогон на push дал бы дубль на тот же коммит.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aimuzov/infra-mcp-kit/check@v2
        # Образ собирается и на сервере, но лучше, чтобы он сломался здесь.
        with:
          docker: deploy/Dockerfile
          coverage-lines: 97
      # Страницы в настоящем Chromium на собранной статике: CSP режет инлайн-код молча,
      # это видно только в консоли браузера. Браузер кэшируется по версии Playwright,
      # системные библиотеки ставятся из apt каждый прогон. Снимки уходят артефактом.
      - id: playwright
        run: echo "version=$(npm ls playwright --json | jq -r '.dependencies.playwright.version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: test-results/screens
          if-no-files-found: ignore
