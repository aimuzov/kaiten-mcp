name: Check

# На main эти проверки вызывает workflow релиза перед публикацией и деплоем, а ветки
# проверяются через PR. Отдельный прогон на push дал бы дубль на тот же коммит.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aimuzov/infra-mcp-kit/check@v3
        # Образ собирается и на сервере, но лучше, чтобы он сломался здесь.
        with:
          docker: deploy/Dockerfile
          coverage-lines: 97
          # Страницы в настоящем Chromium на собранной статике: CSP режет инлайн-код молча,
          # это видно только в консоли браузера. Chromium ставит и кэширует кит.
          ui: true
      # Снимки уходят артефактом.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: test-results/screens
          if-no-files-found: ignore
